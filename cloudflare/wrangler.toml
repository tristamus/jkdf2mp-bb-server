# The always-on lobby on Cloudflare Workers. See README.md.
name = "jkdf2mp"
main = "src/lobby.js"
compatibility_date = "2026-09-01"

# The site's own domain, and www, which only sends page loads on to it.
# Cloudflare makes their DNS records and certificates; the domain has to be
# a zone in the same Cloudflare account, active before the first deploy.
routes = [
  { pattern = "jediknight.zone", custom_domain = true },
  { pattern = "www.jediknight.zone", custom_domain = true },
]
# The old address stays on, so its links and the tabs still open there keep
# working: page loads there are sent on to SITE (src/moved.js), the lobby
# stays. Without this line, wrangler turns workers.dev off once routes are set.
workers_dev = true

# index.html, move-out.html, and under e/ the engines' files and unzip.js,
# named by their content (with a .br of each beside it), as the kit's build
# script (tools/build-kit.mjs) makes them, also those of the last kits, for
# pages opened before a deploy; the room pictures in rooms/; and _headers.
# /relay, /summary, /imperial-games, the page itself (so it can be sent on
# from an old address), e/ (src/engine.js), the match record's pages
# (src/ladder-pages.js) and its screenshots (src/ladder-shots.js) run the
# Worker, and so does a path with no file; the rest is served straight from
# Cloudflare.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/relay", "/summary", "/imperial-games", "/", "/index.html", "/e/*", "/matches", "/match/*", "/players", "/player/*", "/ladder/*", "/shot/*"]

# Keeps the lobby's own log lines (console.log) in Workers Logs in the
# Cloudflare dashboard, 3 days on the free plan and 7 on Workers Paid, so a day
# that ran out can be looked at afterwards. Without the log Cloudflare writes
# for each invocation: if that's one per incoming message, a match through the
# lobby (~50,000 a minute) would go past the free plan's 200,000 a day.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# Match summaries (src/summary.js), kept three months. Workers Analytics Engine
# makes the dataset the first time one is written. README.md says how to read
# them back.
[[analytics_engine_datasets]]
binding = "SUMMARIES"
dataset = "jkdf2mp_summaries"

# The match record (src/ladder.js): a D1 database for the matches the games
# in the rooms report, on since kit 94. Without this block the record is off:
# the lobby asks for no reports and the pages aren't served, and the matches
# already saved stay in the database. The id only says which database it is:
# reading or writing one takes a login to the Cloudflare account it is in. A
# copy of the lobby in another account makes its own with
# `npx wrangler d1 create jkdf2mp-ladder` and puts the database_id that
# prints here. The lobby makes the tables itself. README.md, The match record.
[[d1_databases]]
binding = "LADDER"
database_name = "jkdf2mp-ladder"
database_id = "d17bff22-b11d-4f1b-8414-a01b190eec2d"

# Screenshots on match pages (src/ladder-shots.js): an R2 bucket for the
# pictures players' pages send of their matches. Without this block, or with
# LADDER_SHOTS = "0" below, the lobby takes none and the match pages are as
# they were; the pictures already there stay in the bucket. The account needs
# R2 added once (dashboard, Storage & databases > R2), then
# `npx wrangler r2 bucket create jkdf2mp-shots` makes the bucket. A deploy
# with this block fails until the bucket is there. README.md, Screenshots on
# match pages.
[[r2_buckets]]
binding = "SHOTS"
bucket_name = "jkdf2mp-shots"

# The free plan only has Durable Objects that keep their storage in SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

[vars]
# Handed to every page for WebRTC (Cloudflare's own STUN server, from its
# Realtime docs). Leave it empty to send every game packet through the relay.
STUN = "stun:stun.cloudflare.com:3478"
# Where the site lives, and its old address, whose page loads go there with
# "moved" (src/moved.js). Leave SITE empty to serve every address as it is.
SITE = "https://jediknight.zone"
MOVED_FROM = "https://jkdf2mp.jkdf2mp-lobby.workers.dev"
# 301 since 2026-10-29, after the move was checked with 302. Browsers keep a
# 301 for good, so jediknight.zone has to stay.
MOVED_STATUS = "301"
# The Imperial Network Protocol relay whose games the page lists beside the
# lobby's (/imperial-games, src/imperial.js): sithmartyr's, which the page's
# Multiplayer menu also uses (IMPERIAL_SERVER in index.html). Leave it empty to
# turn the list off: the route answers 404 and the page shows no Imperial
# games. The game's own Imperial connection doesn't depend on it.
IMPERIAL_LIST = "lobby.jkjunkie.com"
# Dedicated servers on it that the page always shows first, matched by
# address: "<game> <address:port> <name>", several separated by commas.
IMPERIAL_PINNED = "jk1 162.248.94.121:27960 Coruscant"
# From this time, older games no longer get room passwords (kit 90 README, Settings).
PASSWORDS_FOR_OLD_GAMES_UNTIL = "2026-11-09T21:30:00Z"
# "0" stops the lobby taking and showing screenshots while the bucket stays
# bound. SHOTS_CONTACT is where the match pages say to ask for a picture to be
# taken down: an https address, or a line of text. SHOTS_MAX_GB is how much
# the lobby stores before it stops taking pictures: 8 when it isn't set,
# under the 10 GB a month R2 stores without charge.
# LADDER_SHOTS = "0"
# SHOTS_CONTACT = ""
# SHOTS_MAX_GB = "8"
# The match record's Discord post (the DISCORD_WEBHOOK secret) is for matches
# of this many players or more, and links to the match's page here; without
# MATCH_LINKS, at SITE.
# DISCORD_MIN_PLAYERS = "3"
# MATCH_LINKS = "https://jediknight.zone"

# A test address with its own lobby: `npx wrangler deploy --env beta` makes a
# separate Worker, jkdf2mp-beta, on beta.jediknight.zone. A netcode or lobby
# change goes there first, for a few players to try, and then the same files go
# to the site with `npx wrangler deploy --env=""`. Its lobby is its own, so
# nobody lands in a test match from the site. Bindings and variables aren't
# carried over to an environment, so they're here again. TURN needs its two
# secrets set on jkdf2mp-beta too (`--env beta` after `npx wrangler secret put
# TURN_KEY_ID`, and the same for TURN_KEY_API_TOKEN); without them, its players
# who can't link directly go through its lobby.
[env.beta]
routes = [
  { pattern = "beta.jediknight.zone", custom_domain = true },
]
workers_dev = false

[[env.beta.durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# Its own, so test matches stay out of the site's.
[[env.beta.analytics_engine_datasets]]
binding = "SUMMARIES"
dataset = "jkdf2mp_beta_summaries"

# Its own match record, so test matches stay out of the site's. As above
# (`npx wrangler d1 create jkdf2mp-ladder-beta` made it).
[[env.beta.d1_databases]]
binding = "LADDER"
database_name = "jkdf2mp-ladder-beta"
database_id = "5e3266ed-0d04-4c94-a643-156a4b00cc18"

# Its own pictures (`npx wrangler r2 bucket create jkdf2mp-shots-beta`).
[[env.beta.r2_buckets]]
binding = "SHOTS"
bucket_name = "jkdf2mp-shots-beta"

[env.beta.vars]
STUN = "stun:stun.cloudflare.com:3478"
# Nothing moves: every page load is served where it is.
SITE = ""
MOVED_FROM = ""
MOVED_STATUS = "302"
IMPERIAL_LIST = "lobby.jkjunkie.com"
IMPERIAL_PINNED = "jk1 162.248.94.121:27960 Coruscant"
MATCH_LINKS = "https://beta.jediknight.zone"
