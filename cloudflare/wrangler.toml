# The always-on lobby on Cloudflare Workers. See README.md.
name = "jkdf2mp"
main = "src/lobby.js"
compatibility_date = "2026-09-01"

# The site's own domain, and www, which only sends page loads on to it.
# Cloudflare makes their DNS records and certificates; the domain has to be
# a zone in the same Cloudflare account, active before the first deploy.
routes = [
  { pattern = "jediknight.zone", custom_domain = true },
  { pattern = "www.jediknight.zone", custom_domain = true },
]
# The old address stays on, so its links and the tabs still open there keep
# working: page loads there are sent on to SITE (src/moved.js), the lobby
# stays. Without this line, wrangler turns workers.dev off once routes are set.
workers_dev = true

# index.html, openjkdf2.js and openjkdf2.wasm, which get-build.mjs fetches,
# and move-out.html. Only /relay, /summary, /imperial-games and the page itself
# run the Worker (the page so it can be sent on from an old address); the rest
# is served straight from Cloudflare.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/relay", "/summary", "/imperial-games", "/", "/index.html"]

# Keeps the lobby's own log lines (console.log) in Workers Logs in the
# Cloudflare dashboard, 3 days on the free plan and 7 on Workers Paid, so a day
# that ran out can be looked at afterwards. Without the log Cloudflare writes
# for each invocation: if that's one per incoming message, a match through the
# lobby (~50,000 a minute) would go past the free plan's 200,000 a day.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# Match summaries (src/summary.js), kept three months. Workers Analytics Engine
# makes the dataset the first time one is written. README.md says how to read
# them back.
[[analytics_engine_datasets]]
binding = "SUMMARIES"
dataset = "jkdf2mp_summaries"

# The free plan only has Durable Objects that keep their storage in SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

[vars]
# Handed to every page for WebRTC (Cloudflare's own STUN server, from its
# Realtime docs). Leave it empty to send every game packet through the relay.
STUN = "stun:stun.cloudflare.com:3478"
# Where the site lives, and its old address, whose page loads go there with
# "moved" (src/moved.js). Leave SITE empty to serve every address as it is.
SITE = "https://jediknight.zone"
MOVED_FROM = "https://jkdf2mp.jkdf2mp-lobby.workers.dev"
# 301 since 2026-10-29, after the move was checked with 302. Browsers keep a
# 301 for good, so jediknight.zone has to stay.
MOVED_STATUS = "301"
# The Imperial Network Protocol relay whose games the page lists beside the
# lobby's (/imperial-games, src/imperial.js): sithmartyr's, which the page's
# Multiplayer menu also uses (IMPERIAL_SERVER in index.html). Leave it empty to
# turn the list off: the route answers 404 and the page shows no Imperial
# games. The game's own Imperial connection doesn't depend on it.
IMPERIAL_LIST = "lobby.jkjunkie.com"
# Dedicated servers on it that the page always shows first, matched by
# address: "<game> <address:port> <name>", several separated by commas.
IMPERIAL_PINNED = "jk1 162.248.94.121:27960 Coruscant"

# A test address with its own lobby: `npx wrangler deploy --env beta` makes a
# separate Worker, jkdf2mp-beta, on beta.jediknight.zone. A netcode or lobby
# change goes there first, for a few players to try, and then the same files go
# to the site with `npx wrangler deploy --env=""`. Its lobby is its own, so
# nobody lands in a test match from the site. Bindings and variables aren't
# carried over to an environment, so they're here again. TURN needs its two
# secrets set on jkdf2mp-beta too (`--env beta` after `npx wrangler secret put
# TURN_KEY_ID`, and the same for TURN_KEY_API_TOKEN); without them, its players
# who can't link directly go through its lobby.
[env.beta]
routes = [
  { pattern = "beta.jediknight.zone", custom_domain = true },
]
workers_dev = false

[[env.beta.durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# Its own, so test matches stay out of the site's.
[[env.beta.analytics_engine_datasets]]
binding = "SUMMARIES"
dataset = "jkdf2mp_beta_summaries"

[env.beta.vars]
STUN = "stun:stun.cloudflare.com:3478"
# Nothing moves: every page load is served where it is.
SITE = ""
MOVED_FROM = ""
MOVED_STATUS = "302"
IMPERIAL_LIST = "lobby.jkjunkie.com"
IMPERIAL_PINNED = "jk1 162.248.94.121:27960 Coruscant"
